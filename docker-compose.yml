services:
  db:
    image: postgres:16
    env_file: .env
    ports:
      - "5433:5432"          # host:contenedor (5433 para no chocar con un Postgres local)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  etl:
    build: .
    env_file: .env
    volumes:
      - ./data/output:/app/data/output
    depends_on:
      db:
        condition: service_healthy

  adminer:                   # UI web para mirar la base: http://localhost:8080
    image: adminer:4.8.1
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  pgdata:
